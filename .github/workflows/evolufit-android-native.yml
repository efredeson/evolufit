name: EvoluFit Android Nativo - APK teste
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/evolufit-android-native.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar projeto EvoluFit
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes Android cmdline-tools, avoiding old 'tools' package
      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Obter imagens originais aprovadas do projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-native/app/src/main/assets/exercises android-native/app/src/main/res/drawable-nodpi
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/assets"
          curl -fL --retry 3 "$BASE/evolufit-gatinho-hd.webp" -o android-native/app/src/main/assets/mascot.webp
          curl -fL --retry 3 "$BASE/evolufit-gatinho-hd.webp" -o android-native/app/src/main/res/drawable-nodpi/launcher.webp
          for image in marcha cadeira bracos lateral agachamento parede prancha alongamento; do
            curl -fL --retry 3 "$BASE/exercicios/${image}-foto.webp" -o "android-native/app/src/main/assets/exercises/${image}.webp"
          done
          test -s android-native/app/src/main/assets/mascot.webp
      - name: Compilar APK Android sem WebView
        run: gradle --no-daemon --project-dir android-native :app:assembleDebug
      - name: Validar instalador Android assinado
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Disponibilizar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFit-Android-Nativo-debug-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK direto no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE="android-native/app/build/outputs/apk/debug/app-debug.apk"
          cp "$FILE" android-native/EvoluFit-Nativo-Android-TESTE.apk
          TAG="evolufit-android-teste-v0.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" android-native/EvoluFit-Nativo-Android-TESTE.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android-native/EvoluFit-Nativo-Android-TESTE.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "EvoluFit Android Nativo — APK de teste" \
              --notes "Versão experimental Android nativa, sem WebView. Baixe o arquivo .apk abaixo e instale pelo gerenciador de arquivos do Android. APK assinado com chave de debug; as próximas versões podem precisar desinstalar esta versão antes de instalar." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi